# .github/workflows/dvc-check.yml
# On every pull request, pull the data the receipts point to and fail if a
# pipeline's dvc.lock doesn't match its code, settings and data.
# Needs two repository secrets: AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.

name: dvc-check
on: pull_request

jobs:
  dvc:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pipeline: [corporate, project_finance]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Pull data and check the lock
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          uv run tools/run.py ${{ matrix.pipeline }} pull
          uv run dvc status --quiet pipelines/${{ matrix.pipeline }}/dvc.yaml
